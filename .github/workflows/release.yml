name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Image name and version
        id: v
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - run: docker build --build-arg VERSION=${{ steps.v.outputs.version }} -t "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" .
      - run: scripts/smoke-test.sh "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" "${{ steps.v.outputs.version }}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        run: |
          REF="${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}"
          docker push "$REF"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$REF")
          echo "digest=${DIGEST#*@}" >> "$GITHUB_OUTPUT"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "Image ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }} (digest ${{ steps.push.outputs.digest }}). Deploy by setting this tag in compose.yml."
