name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg VERSION=ci-${GITHUB_SHA::7} -t cashew-mcp:ci .
      - run: scripts/smoke-test.sh cashew-mcp:ci "ci-${GITHUB_SHA::7}"
